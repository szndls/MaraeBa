# 2단계: 교사 발화로 "지금 배우는 개념" 추측 기준 — 자유롭게 수정 가능.
# 여기서 고른 성취기준 코드는 코드가 math-terms.json에서 해당 학년군의 코드 목록으로
# enum 강제하므로, 목록에 없는 코드를 지어내지는 않는다. 이 파일은 "어떤 코드를 고를지"의
# 판단 기준만 다룬다.

purpose: >
  교사의 발화 전체(특히 발문과 설명)를 보고, 지금 가장 중심적으로 다루고 있는
  성취기준을 학년군 후보 목록 중에서 하나 고른다.

what_to_consider:
  - 교사가 직접 언급한 용어/개념 (예: 단위분수, 분모가 같은 분수)
  - 학생에게 요구하는 활동의 종류 (비교하기, 계산하기, 설명하기 등)
  - 수업 전체에서 반복적으로 등장하는 핵심 주제
  - 여러 성취기준이 조금씩 관련되어 보이면, 가장 직접적으로 다뤄지는 것 하나를 고른다

what_to_avoid:
  - 발화 중 한두 단어만 보고 성급하게 판단하지 않는다
  - 목록에 없는 성취기준 코드를 만들어내지 않는다 (반드시 주어진 후보 중에서 선택)

output_requirements:
  - 근거가 된 교사 발화(세그먼트)를 반드시 함께 표시한다
  - 판단 이유를 한국어 1~2문장으로 설명한다

general_notes: |
  - 이 추측은 교사가 확인·수정할 수 있어야 한다 (설계 원칙).
  - (임시 기준 — 실제 사용해보고 조정이 필요할 수 있습니다.)
