# 3단계: 용어 탐지 — 임시 기준, 자유롭게 수정 가능.
# ⚠️ 아직 코드에서 사용하지 않음 (2단계까지만 구현됨). 나중에 3단계 구현 시 연결 예정.
#
# 용어와 성취기준 순서 대조(아직 모름 확정 / 아직 모를 수 있음)는 criteria/math-terms.json의
# how_to_use 규칙에 따라 "코드"로 판단한다. 이 파일은 그중 "목록에 없는 어려운 어휘"
# (unlisted_hard_word) 판단에만 쓰이는, LLM에게 줄 기준이다.

purpose: >
  criteria/math-terms.json 용어 목록에는 없지만, 해당 학년 학생에게는 이해하기
  어려울 수 있는 일반 어휘(교육과정 용어가 아닌 것)를 찾는다.

what_to_consider:
  - "학년 수준을 넘는 수학 개념어나 한자어 학술 용어일 때만 플래그한다"
  - "예: 등분, 대소 관계처럼 교육과정 용어 목록엔 없지만 수학 수업에서 흔히 쓰는 개념어·학술 표현"

what_to_avoid:
  - "math-terms.json에 이미 있는 용어는 이 판단 대상이 아니다 (코드가 이미 처리함)"
  - "일상 동사·형용사(비교하다, 나누다, 크다 등)는 수학적 맥락에서 쓰였어도 플래그하지 않는다 — 개념어·학술 용어가 아니라 3학년도 일상에서 쓰는 말이다"
  - "학년 수준에서 이미 일상적으로 쓰는 쉬운 말은 플래그하지 않는다"

output_requirements:
  - 찾은 단어, 이유, 근거 세그먼트를 함께 표시한다

general_notes: |
  - (임시 기준 — 실제 사용해보고 조정이 필요할 수 있습니다.)
